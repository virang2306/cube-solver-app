name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web files into www
        run: |
          mkdir www
          cp -r index.html sw.js manifest.webmanifest favicon.svg icons lib www/

      - name: Set up Capacitor (create Android project)
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Cube Solver" com.virang.cubesolver --web-dir www
          npx cap add android
          npx cap sync android

      - name: Apply app icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            cp icons/icon-512.png $d/ic_launcher.png
            cp icons/icon-512.png $d/ic_launcher_round.png
            rm -f $d/ic_launcher_foreground.png
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Cube Solver APK (build ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
